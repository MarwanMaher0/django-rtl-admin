site_name: django-rtl-admin
site_description: A properly bilingual, right-to-left Django admin.
site_url: https://django-rtl-admin.readthedocs.io/
repo_url: https://github.com/MarwanMaher0/django-rtl-admin
repo_name: MarwanMaher0/django-rtl-admin
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quick-start.md
  - Live demo and deployment: deployment.md
  - Reference:
      - Configuration: configuration.md
      - Template tags and filters: template-tags.md
      - BidiSafeAdminMixin: admin-mixin.md
      - System checks: system-checks.md
      - Python API: api.md
  - Stock admin RTL defects: rtl-defects.md
  - Translations and contributing a locale: translations.md
  - Changelog: changelog.md

hooks:
  - docs/hooks/seo.py

exclude_docs: |
  hooks/
  overrides/

extra_css:
  - assets/docs.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ar
          name: العربية
          build: true
          nav_translations:
            Home: الرئيسية
            Installation: التثبيت
            Quick start: البدء السريع
            Live demo and deployment: العرض التجريبي المباشر والنشر
            Reference: المرجع
            Configuration: الإعدادات
            Template tags and filters: وسوم القوالب ومرشحاتها
            BidiSafeAdminMixin: المزيج BidiSafeAdminMixin
            System checks: فحوصات النظام
            Stock admin RTL defects: عيوب RTL في لوحة الإدارة الافتراضية
            Translations and contributing a locale: الترجمات والمساهمة بإعدادات محلية
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
