name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The cell whose coverage is published. Babel installed, current LTS Django.
  COVERAGE_SESSION: tests(py3.13-django5.2)

jobs:
  matrix:
    name: read the matrix from noxfile.py
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.list.outputs.sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - id: list
        name: List the test sessions
        run: |
          sessions="$(uvx nox -l --json -s tests | python3 -c '
          import json, sys
          print(json.dumps([s["session"] for s in json.load(sys.stdin)]))
          ')"
          echo "$sessions"
          echo "sessions=$sessions" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.session }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.matrix.outputs.sessions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nox uses uv as its venv backend, so uv downloads the Python each
      # cell asks for; no setup-python step is needed.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run the cell (coverage table goes to the job summary)
        run: uvx nox -s "${{ matrix.session }}"

      - name: Upload the coverage report
        if: matrix.session == env.COVERAGE_SESSION
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.lcov
            .coverage

      # Coveralls authenticates with the workflow's own GITHUB_TOKEN; there
      # is nothing to configure in the repository secrets.
      - name: Publish coverage to Coveralls
        if: matrix.session == env.COVERAGE_SESSION
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          format: lcov

  e2e:
    name: browser tests (newest Python/Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Run Playwright against the admin in Arabic and English
        run: uvx nox -s e2e
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test-artifacts/e2e/
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx nox -s lint

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uvx nox -s typecheck

  docs:
    name: build the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: mkdocs build --strict

  build:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The wheel must carry the templates, static files, translations and py.typed
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "django_rtl_admin/py.typed",
              "django_rtl_admin/templates/admin/base_site.html",
              "django_rtl_admin/templates/admin/change_list_results.html",
              "django_rtl_admin/templates/admin/edit_inline/tabular.html",
              "django_rtl_admin/templates/admin/widgets/split_datetime.html",
              "django_rtl_admin/templates/django_rtl_admin/base_site.html",
              "django_rtl_admin/templates/django_rtl_admin/language_switcher.html",
              "django_rtl_admin/static/django_rtl_admin/css/rtl-admin.css",
              "django_rtl_admin/static/django_rtl_admin/js/language_switcher.js",
              "django_rtl_admin/locale/ar/LC_MESSAGES/django.mo",
              "django_rtl_admin/locale/ckb/LC_MESSAGES/django.mo",
              "django_rtl_admin/locale/fa/LC_MESSAGES/django.mo",
              "django_rtl_admin/locale/he/LC_MESSAGES/django.mo",
              "django_rtl_admin/locale/ug/LC_MESSAGES/django.mo",
              "django_rtl_admin/locale/ur/LC_MESSAGES/django.mo",
          }
          missing = sorted(required - names)
          assert not missing, f"missing from {wheel.name}: {missing}"
          print(f"{wheel.name} ok ({len(names)} files)")
          PY

  sdist:
    name: build and test the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - name: Unpack the sdist, install it and run pytest
        run: |
          sdist="$(ls "$PWD"/dist/*.tar.gz)"
          tmpdir="$(mktemp -d)"
          tar -xzf "$sdist" -C "$tmpdir"
          cd "$tmpdir"/*/
          test -f noxfile.py
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          python -m pip install ".[test]"
          pytest -m "not e2e"
